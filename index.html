<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Key Generator</title>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl text-center w-96">
        <h1 class="text-2xl font-bold mb-4">Access Key</h1>
        <div id="key-box" class="bg-gray-700 p-4 rounded mb-4 font-mono text-blue-400 break-all">
            Click generate to get a key
        </div>
        <button onclick="generateKey()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition">Generate</button>
        <button onclick="copyKey()" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded font-bold transition ml-2">Copy</button>
    </div>

    <script>
        let currentKey = "";
        function generateKey() {
            currentKey = 'KEY-' + Math.random().toString(36).substr(2, 12).toUpperCase();
            document.getElementById('key-box').innerText = currentKey;
        }
        function copyKey() {
            navigator.clipboard.writeText(currentKey);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
